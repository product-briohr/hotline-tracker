[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync-hotline"
  status = 200

[[redirects]]
  from = "/api/issues"
  to = "/.netlify/functions/list-issues"
  status = 200

[[redirects]]
  from = "/api/issues/update"
  to = "/.netlify/functions/update-issue"
  status = 200

[[redirects]]
  from = "/api/issues/create"
  to = "/.netlify/functions/create-issue"
  status = 200

[[redirects]]
  from = "/api/issues/delete"
  to = "/.netlify/functions/delete-issue"
  status = 200

[[redirects]]
  from = "/api/issues/reclassify"
  to = "/.netlify/functions/reclassify-issues"
  status = 200

[[redirects]]
  from = "/api/sync/test-slack"
  to = "/.netlify/functions/test-slack-sync"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/auth-session"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200
