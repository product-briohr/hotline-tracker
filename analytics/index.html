<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics - Product Hotline Tracker</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <script src="/auth-gate.js"></script>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-title">
          <h1>Hotline Analytics</h1>
          <p>Ask quick questions about recurring issues</p>
        </div>
        <div class="topbar-actions">
          <a href="/" class="btn topbar-cta-btn analytics-link-btn">Dashboard</a>
          <button id="themeToggle" class="theme-switch" type="button" aria-label="Toggle theme" aria-pressed="false">
            <span class="theme-icon sun">☀</span>
            <span class="theme-icon moon">☾</span>
            <span class="theme-knob" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <section class="analytics-grid">
        <article class="analytics-card">
          <h2>Issue Type Recurrence</h2>
          <div id="issueTypeBars" class="issue-type-bars"></div>
        </article>
      </section>
    </main>

    <script type="module" src="/analytics/analytics.js"></script>
  </body>
</html>
