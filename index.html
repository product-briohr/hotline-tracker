<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Hotline Tracker</title>
    <meta
      name="description"
      content="Made with ❤️ by BrioHR Product Team"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Product Hotline Tracker" />
    <meta
      property="og:description"
      content="Made with ❤️ by BrioHR Product Team"
    />
    <meta property="og:image" content="/favicon.png" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Product Hotline Tracker" />
    <meta
      property="twitter:description"
      content="Made with ❤️ by BrioHR Product Team"
    />
    <meta property="twitter:image" content="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <script src="/auth-gate.js"></script>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-title">
          <h1>Product Hotline Tracker</h1>
          <p>Made with <span aria-hidden="true">❤️</span> by BrioHR Product Team</p>
        </div>
        <div class="topbar-actions">
          <button id="newIssueBtn" class="btn" type="button">+ New Issue</button>
          <button id="exportBtn" class="btn" type="button">Export Excel</button>
          <button id="themeToggle" class="theme-switch" type="button" aria-label="Toggle theme" aria-pressed="false">
            <span class="theme-icon sun">☀</span>
            <span class="theme-icon moon">☾</span>
            <span class="theme-knob" aria-hidden="true"></span>
          </button>
          <button id="syncBtn" class="btn btn-primary hidden" aria-hidden="true">Sync Now</button>
        </div>
      </header>

      <section class="meta-row">
        <span id="lastUpdated" class="meta-note">Last updated: -</span>
        <span id="toast" class="toast"></span>
      </section>

      <section class="table-filters">
        <label class="f-date-range">Date range
          <div class="date-range-inputs">
            <input id="dateFromFilter" type="date" />
            <input id="dateToFilter" type="date" />
          </div>
        </label>
        <label class="f-module">Module<div id="moduleFilterMs"></div></label>
        <label class="f-issue-type">Issue Type<div id="issueTypeFilterMs"></div></label>
        <label class="f-cs">CS<div id="csFilterMs"></div></label>
        <label class="f-pm-owner">PM Owner<div id="pmOwnerFilterMs"></div></label>
        <label class="f-search">Issue/Question Search<input id="search" placeholder="Search issue/question..." /></label>
        <button id="clearFiltersBtn" class="clear-filters-text" type="button">Clear filters</button>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Module</th>
              <th>Issue Type</th>
              <th>CS</th>
              <th>PM Owner</th>
              <th>Issue / Question Description</th>
              <th>Comments</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>

      <section class="pager">
        <div id="pageNumbers" class="page-numbers"></div>
        <div class="pager-meta">
          <span id="pageSummary" class="page-summary">Results: 0 - 0 of 0</span>
          <label class="page-size-wrap" for="pageSizeSelect" aria-label="Rows per page">
            <select id="pageSizeSelect" class="page-size-select">
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>
      </section>

    </main>

    <div id="newIssueModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="newIssueTitle">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="newIssueTitle">New Issue</h2>
          <button id="newIssueClose" class="icon-only" type="button" aria-label="Close">✕</button>
        </div>
        <form id="newIssueForm" class="modal-form">
          <label>Date<input id="newDate" type="date" required /></label>
          <label>Module<div id="newModuleMs"></div></label>
          <label>Issue Type<select id="newIssueType" required></select></label>
          <label>CS<div id="newCsMs"></div></label>
          <label>PM Owner<div id="newPmOwnerMs"></div></label>
          <label class="full">Issue/Question Description<textarea id="newDescription" rows="5" required></textarea></label>
          <label class="full">Comments<textarea id="newComments" rows="4"></textarea></label>
          <div class="modal-actions">
            <button type="button" id="newIssueCancel" class="btn">Cancel</button>
            <button type="submit" id="newIssueSave" class="btn btn-primary">Save Issue</button>
          </div>
        </form>
      </div>
    </div>

    <div id="deleteConfirmModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
      <div class="modal-card confirm-card">
        <div class="modal-head">
          <h2 id="deleteConfirmTitle">Delete Record</h2>
          <button id="deleteConfirmClose" class="icon-only" type="button" aria-label="Close">✕</button>
        </div>
        <p class="confirm-text">Are you sure you want to delete this record? This action cannot be undone.</p>
        <div class="modal-actions">
          <button type="button" id="deleteConfirmCancel" class="btn">Cancel</button>
          <button type="button" id="deleteConfirmSubmit" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
