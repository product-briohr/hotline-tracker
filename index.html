<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Hotline Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-title">
          <h1>Product Hotline Tracker</h1>
          <p>Auto-synced from Gemini notes in Google Drive</p>
        </div>
        <div class="topbar-actions">
          <input id="search" placeholder="Search description/comments..." />
          <button id="themeToggle" class="btn" type="button" aria-label="Toggle theme">Dark mode</button>
          <button id="syncBtn" class="btn btn-primary">Sync Now</button>
        </div>
      </header>

      <section class="meta-row">
        <span id="toast" class="toast"></span>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Module</th>
              <th>Issue Type</th>
              <th>CS</th>
              <th>PM Owner</th>
              <th>Issue / Question Description</th>
              <th>Comments</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>

      <section class="pager">
        <div id="pageNumbers" class="page-numbers"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
